name: Build Windows

on:
  push:
    branches: [switch-enhancements]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'amurgshere/ppsspp'
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            artifact: PPSSPP-Windows-x64
          - platform: ARM64
            artifact: PPSSPP-Windows-ARM64

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Fetch version tags
        shell: bash
        run: |
          git fetch --deepen=15000 --no-recurse-submodules --tags || true
          count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            git remote add hrydgard https://github.com/hrydgard/ppsspp.git
            git fetch --deepen=15000 --no-recurse-submodules --tags --force hrydgard || true
          fi

      - name: Generate git-version.cpp
        shell: pwsh
        run: |
          $GIT_VERSION = git describe --always
          Write-Host "Git version: $GIT_VERSION"
          "const char *PPSSPP_GIT_VERSION = `"$GIT_VERSION`";" | Out-File -Encoding utf8 git-version.cpp
          "#define PPSSPP_GIT_VERSION_NO_UPDATE 1" | Out-File -Encoding utf8 -Append git-version.cpp
          if ($GIT_VERSION.StartsWith("v")) {
            $WIN_VERSION_COMMA = $GIT_VERSION -replace '^v', '' -replace '-g[0-9a-f]+$', '' -replace '[-\.]', ','
            "#define PPSSPP_WIN_VERSION_STRING `"$GIT_VERSION`"" | Out-File -Encoding utf8 Windows/win-version.h
            "#define PPSSPP_WIN_VERSION_COMMA $WIN_VERSION_COMMA" | Out-File -Encoding utf8 -Append Windows/win-version.h
            "#define PPSSPP_WIN_VERSION_NO_UPDATE 1" | Out-File -Encoding utf8 -Append Windows/win-version.h
          }

      - name: Build
        run: msbuild /m /p:TrackFileAccess=false /p:Configuration=Release /p:Platform=${{ matrix.platform }} Windows/PPSSPP.sln

      - name: Package
        shell: pwsh
        run: |
          mkdir ppsspp
          Copy-Item PPSSPP*.exe ppsspp/ -ErrorAction SilentlyContinue
          Copy-Item Windows/${{ matrix.platform }}/Release/*.exe ppsspp/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse assets ppsspp/assets
          Remove-Item -Recurse -Force ppsspp/assets/switch

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ppsspp/
          retention-days: 30

  test:
    if: github.repository == 'amurgshere/ppsspp'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Fetch test submodules
        run: git submodule update --init pspautotests

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: PPSSPP-Windows-x64-${{ github.sha }}
          path: ppsspp/

      - name: Unit tests
        run: ppsspp\UnitTest.exe ALL

      - name: Headless tests
        run: python test.py -g --graphics=software
