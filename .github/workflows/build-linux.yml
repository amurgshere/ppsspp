name: Build Linux

on:
  push:
    branches: [all-platforms-reintegration]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'amurgshere/ppsspp'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch version tags
        run: |
          git fetch --deepen=15000 --no-recurse-submodules --tags || true
          count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            git remote add hrydgard https://github.com/hrydgard/ppsspp.git
            git fetch --deepen=15000 --no-recurse-submodules --tags --force hrydgard || true
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libsdl2-dev libvulkan-dev \
            libpng-dev zlib1g-dev libsnappy-dev \
            libglu1-mesa-dev

      - name: Build (gcc)
        if: matrix.compiler == 'gcc'
        run: ./b.sh --no-png --headless --release

      - name: Build (clang)
        if: matrix.compiler == 'clang'
        env:
          CC: clang
          CXX: clang++
        run: ./b.sh --no-png --headless --release

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: PPSSPP-Linux-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            build*/PPSSPPHeadless
          retention-days: 30
