name: Build Linux

on:
  push:
    branches: [switch-enhancements]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'amurgshere/ppsspp'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch version tags
        run: |
          git fetch --deepen=15000 --no-recurse-submodules --tags || true
          count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            git remote add hrydgard https://github.com/hrydgard/ppsspp.git
            git fetch --deepen=15000 --no-recurse-submodules --tags --force hrydgard || true
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libsdl2-dev libvulkan-dev \
            libpng-dev zlib1g-dev libsnappy-dev \
            libglu1-mesa-dev

      - name: Build (gcc)
        if: matrix.compiler == 'gcc'
        run: ./b.sh --no-png --headless --unittest --release

      - name: Build (clang)
        if: matrix.compiler == 'clang'
        env:
          CC: clang
          CXX: clang++
        run: ./b.sh --no-png --headless --unittest --release

      - name: Package
        run: |
          mkdir ppsspp
          cp build*/PPSSPPSDL ppsspp/ 2>/dev/null || true
          cp build*/PPSSPPHeadless ppsspp/
          cp build*/PPSSPPUnitTest ppsspp/
          cp -r assets ppsspp/assets

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: PPSSPP-Linux-${{ matrix.compiler }}-${{ github.sha }}
          path: ppsspp/
          retention-days: 30

  test:
    if: github.repository == 'amurgshere/ppsspp'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Fetch test submodules
        run: git submodule update --init pspautotests

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libglu1-mesa-dev python3

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: PPSSPP-Linux-${{ matrix.compiler }}-${{ github.sha }}
          path: ppsspp/

      - name: Fix permissions
        run: |
          cp $(find ppsspp -name PPSSPPHeadless) .
          cp $(find ppsspp -name PPSSPPUnitTest) .
          chmod +x PPSSPPHeadless PPSSPPUnitTest

      - name: Unit tests
        run: ./PPSSPPUnitTest ALL

      - name: Headless tests
        run: python3 test.py -g --graphics=software
