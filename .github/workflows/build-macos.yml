name: Build macOS

on:
  push:
    branches: [switch-enhancements]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'amurgshere/ppsspp'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch version tags
        run: |
          git fetch --deepen=15000 --no-recurse-submodules --tags || true
          count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            git remote add hrydgard https://github.com/hrydgard/ppsspp.git
            git fetch --deepen=15000 --no-recurse-submodules --tags --force hrydgard || true
          fi

      - name: Build
        env:
          CC: clang
          CXX: clang++
        run: ./b.sh --fat --no-png --no-sdl2 --headless --unittest

      - name: Package
        run: |
          mkdir -p ppsspp
          if [ -e build*/PPSSPPSDL.app ]; then
            cp -a build*/PPSSPPSDL.app ppsspp/
            (cd ppsspp && zip -qry PPSSPPSDL.zip PPSSPPSDL.app && rm -rf PPSSPPSDL.app)
          fi
          find build* -name PPSSPPHeadless -exec cp {} ppsspp/ \; 2>/dev/null || true
          find build* -name PPSSPPUnitTest -exec cp {} ppsspp/ \; 2>/dev/null || true
          cp README.md ppsspp/

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: PPSSPP-macOS-${{ github.sha }}
          path: ppsspp/
          retention-days: 30

  test:
    if: github.repository == 'amurgshere/ppsspp'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Fetch test submodules
        run: |
          git submodule update --init pspautotests
          git submodule update --init SDL/macOS

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: PPSSPP-macOS-${{ github.sha }}
          path: ppsspp/

      - name: Fix permissions
        run: |
          cp $(find ppsspp -name PPSSPPHeadless) .
          cp $(find ppsspp -name PPSSPPUnitTest) .
          chmod +x PPSSPPHeadless PPSSPPUnitTest

      - name: Unit tests
        run: ./PPSSPPUnitTest ALL

      - name: Headless tests
        run: python3 test.py -g --graphics=software
